logging:
  level:
    com.dynamicbatch: debug

spring:
  application:
    name: example-boot27

management:
  endpoints:
    web:
      exposure:
        include: dynamicbatch

# ========== 通知配置（自测用）==========
# 填好下方配置后启动：
#   POST /notify/ding?content=xxx
#   POST /notify/wechat?content=xxx
#   POST /notify/email?content=xxx（需引入 spring-boot-starter-mail）
#
# 通知类型（无需额外配置，触发即发）：
#   offer_failed  入队失败告警（submit 入口被拒：组未启动/类型不匹配/Spool 拒绝/写入异常，及类型不匹配毒丸）
#   flush_failed  批次执行失败告警（flush 回调抛异常）
#
# 通知项（可选）每个类型可配静默期，不配或配 0 = 不限流（向后兼容）：
#   notify-items:
#     - type: offer_failed
#       silence-period: 300       # 静默期（秒），300 秒内不再重复发送
#     - type: flush_failed
#       silence-period: 300
dynamic-batch:
  notify:
    platforms:
      - platform: ding
        # TODO 钉钉机器人 webhook，形如：
        # https://oapi.dingtalk.com/robot/send?access_token=你的token
        webhook: "https://oapi.dingtalk.com/robot/send?access_token=REDACTED"
        # TODO 机器人安全设置选“加签”时的密钥；非加签模式留空
        secret: "REDACTED"
        # webhook 未携带 access_token 时，也可在此填 token（与 webhook 二选一）
        # urlKey: ""
        # @ 的手机号，逗号分隔；"all" 或留空 = @所有人
        receivers: "all"
        # HTTP 超时毫秒
        timeout: 3000
      - platform: wechat
#        # TODO 企业微信群机器人 webhook，形如：
#        # https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=你的key
#        webhook: ""
#        # webhook 未携带 key 时，也可在此填 key（与 webhook 二选一）
#        # urlKey: ""
#        timeout: 3000
#      - platform: email
#        # TODO SMTP 配置（需引入 spring-boot-starter-mail）
#        host: "smtp.qq.com"       # SMTP 服务器地址，如 smtp.qq.com
#        port: 465      # SMTP 端口
#        username: ""   # 发件人邮箱（SMTP 登录账号）
#        password: ""   # SMTP 授权码
#        title: dynamic-batch # 邮件标题，可选，默认"攒批通知"
#        receivers: ""  # 收件人地址，逗号分隔
#        timeout: 3000
    notify-items:
      # 所有告警显式才开：登记类型且 enabled: true 才投递，未登记/false 一律不发
      - type: offer_failed
        enabled: true
        silence-period: 30       # 静默期（秒），30 秒内不再重复发送
      - type: flush_failed
        enabled: true
        silence-period: 30
      - type: spool_capacity     # 检测型：配合 test-batch/backlog 接口演示（backlog_demo 组预算 400MB）
        enabled: true
        threshold: 70            # 占磁盘预算百分比，达到即告警；未配置默认 70
        interval-seconds: 5     # 巡检周期（秒），类型级配置（所有组共用）；未配置默认 60
        silence-period: 5      # 持续超限冷却（秒），防每周期刷屏